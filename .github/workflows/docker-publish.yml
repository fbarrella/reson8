name: Build & Publish Server Docker Image

# Runs on pushes to main (i.e. PR merges) that touch apps/server, or on
# changes to this workflow file itself. The Dockerfile's COPY paths are
# relative to the monorepo root, so the build context is the repo root,
# not apps/server/, even though the path filter is scoped to apps/server.
on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/shared-types/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: febarrella/reson8

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read server version
        id: version
        run: echo "value=$(jq -r .version apps/server/package.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
