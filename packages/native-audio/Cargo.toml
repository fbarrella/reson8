[package]
name = "native-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

# Platform-specific capture dependencies (WASAPI via `windows`, PipeWire/Pulse
# bindings) are added in PRD 12.2/12.3 alongside the real per-OS capture code.
# This crate compiles and loads on every target today; every platform module
# is a stub that reports CaptureStatus::Unsupported until those land.

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
