[package]
name = "native-audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# PRD 12.3 — PipeWire native capture, PulseAudio fallback. Both crates wrap
# system C libraries via their `-sys` crates, which need `pkg-config` plus
# the matching dev headers present on the BUILD machine (not just the end
# user's machine) to compile at all:
#   Debian/Ubuntu: libpipewire-0.3-dev libpulse-dev pkg-config
#   Fedora:        pipewire-devel pulseaudio-libs-devel pkgconf-pkg-config
#   Arch/CachyOS:  libpipewire libpulse pkgconf
# This is a new build-time system dependency beyond anything PRD 12.1/12.2
# needed — worth folding into PRD 12.5's release-script assumptions and
# into whatever dev-setup docs exist, not just noted here.
pipewire = "0.8"
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# PRD 12.2 — WASAPI process-loopback capture via ActivateAudioInterfaceAsync.
# Pinned loosely (major line only) since this hasn't been resolved against a
# real registry fetch in this environment (no network-verified `cargo build`
# happened while writing this) — confirm 0.58 is still current when this
# first actually builds, and adjust feature names if `cargo build` reports
# any of them as unknown for the resolved version.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
