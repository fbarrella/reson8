<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reson8 — Screen Share Viewer</title>
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --text-muted: #6a6a7a;
      --accent: #4fc3f7;
      --accent-hover: #29b6f6;
      --border: #2a2a4a;
      --danger: #e57373;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #viewer-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #video-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video-container video {
      max-width: 100%;
      max-height: 100%;
    }

    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(26, 26, 46, 0.92);
      text-align: center;
      padding: 24px;
    }

    #status-overlay.hidden {
      display: none;
    }

    #status-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    #status-message {
      font-size: 13px;
      color: var(--text-secondary);
    }

    #status-overlay.error #status-title {
      color: var(--danger);
    }

    #controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #controls-bar .nickname {
      font-size: 13px;
      color: var(--text-secondary);
      margin-right: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #controls-bar button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 4px;
    }

    #controls-bar button:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    #controls-bar button.active {
      color: var(--accent);
    }

    #volume-slider {
      width: 90px;
      accent-color: var(--accent);
    }

    #btn-exit-stream {
      width: auto;
      gap: 6px;
      padding: 6px 10px;
      color: var(--danger);
    }

    #btn-exit-stream:hover {
      background: rgba(229, 115, 115, 0.15);
      color: var(--danger);
    }
  </style>
</head>

<body>
  <div id="viewer-root">
    <div id="video-container">
      <div id="status-overlay">
        <div id="status-title">Connecting…</div>
        <div id="status-message"></div>
      </div>
    </div>
    <div id="controls-bar">
      <span class="nickname" id="viewer-nickname-label"></span>
      <button id="btn-mute" title="Mute">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
      </button>
      <input type="range" id="volume-slider" min="0" max="100" value="100" title="Volume" />
      <button id="btn-fullscreen" title="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
      </button>
      <button id="btn-exit-stream" title="Exit Stream">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Exit Stream</span>
      </button>
    </div>
  </div>
  <script src="viewer.js"></script>
</body>

</html>
