<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reson8 — Screen Share Viewer</title>
  <link href="../../assets/fonts/inter/inter.css" rel="stylesheet">
  <link href="../../assets/icons/phosphor/regular/style.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0b0;
      --text-muted: #6a6a7a;
      --accent: #4fc3f7;
      --accent-hover: #29b6f6;
      --border: #2a2a4a;
      --danger: #e57373;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #viewer-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* The integrated title bar (PRD 19 R7): logo + "{sharer} · {stream} — {room}". */
    #viewer-titlebar {
      display: none;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 12px;
      background: #161826;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      flex-shrink: 0;
      -webkit-app-region: drag;
      user-select: none;
      padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 12px);
    }

    body.integrated-titlebar #viewer-titlebar {
      display: flex;
    }

    body.integrated-titlebar.platform-darwin #viewer-titlebar {
      padding-left: 80px;
    }

    body.window-fullscreen #viewer-titlebar {
      display: none !important;
    }

    #viewer-titlebar img {
      width: 18px;
      height: 18px;
    }

    #viewer-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #controls-bar {
      -webkit-app-region: no-drag;
    }

    #video-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video-container video {
      max-width: 100%;
      max-height: 100%;
    }

    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(26, 26, 46, 0.92);
      text-align: center;
      padding: 24px;
    }

    #status-overlay.hidden {
      display: none;
    }

    #status-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    #status-message {
      font-size: 13px;
      color: var(--text-secondary);
    }

    #status-overlay.error #status-title {
      color: var(--danger);
    }

    #controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #controls-bar .nickname {
      font-size: 13px;
      color: var(--text-secondary);
      margin-right: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #controls-bar button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 4px;
    }

    #controls-bar button:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    #controls-bar button.active {
      color: var(--accent);
    }

    /* Mute button: blue by default (sound is on), opaque grey once muted —
       the opposite of what a plain `.active`-on-mute toggle would give
       (that class means "highlighted because this is turned ON", which
       reads backwards for mute specifically — muted should look OFF/
       dimmed, not highlighted). Two IDs to outrank the generic
       `#controls-bar button`/`button.active` rules above, same reasoning
       as `#btn-exit-stream` below. */
    #controls-bar #btn-mute {
      color: var(--accent);
    }

    #controls-bar #btn-mute.muted {
      color: var(--text-muted);
    }

    #btn-mute .icon-muted {
      display: none;
    }

    #btn-mute.muted .icon-unmuted {
      display: none;
    }

    #btn-mute.muted .icon-muted {
      display: block;
    }

    #volume-slider {
      width: 110px;
      accent-color: var(--accent);
    }

    #volume-readout {
      min-width: 38px;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
    }

    #controls-bar button .ph {
      font-size: 17px;
    }

    #controls-bar #btn-return {
      width: auto;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 12px;
    }

    /* `#controls-bar #btn-exit-stream` (two IDs), not just `#btn-exit-
       stream` — needs to outrank `#controls-bar button`/`button:hover`
       above (ID + element beats a single ID) or those generic rules win
       the cascade and this stays the default gray/accent-blue instead of
       red, regardless of source order. */
    #controls-bar #btn-exit-stream {
      width: auto;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    #controls-bar #btn-exit-stream:hover {
      background: var(--danger);
      color: #fff;
    }
  </style>
</head>

<body>
  <div id="viewer-root">
    <header id="viewer-titlebar"><img src="logo.png" alt=""><span id="viewer-title"></span></header>
    <div id="video-container">
      <div id="status-overlay">
        <div id="status-title">Connecting…</div>
        <div id="status-message"></div>
      </div>
    </div>
    <div id="controls-bar">
      <span class="nickname" id="viewer-nickname-label"></span>
      <button id="btn-mute" title="Mute">
        <svg class="icon-unmuted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
        <svg class="icon-muted" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="3" y1="21" x2="21" y2="3" />
        </svg>
      </button>
      <input type="range" id="volume-slider" min="0" max="200" step="5" value="100" title="Volume" />
      <span id="volume-readout">100%</span>
      <button id="btn-always-on-top" title="Always on top" aria-pressed="false"><i class="ph ph-push-pin" aria-hidden="true"></i></button>
      <button id="btn-fullscreen" title="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
      </button>
      <button id="btn-return" title="Return to Reson8"><i class="ph ph-arrow-u-down-left" aria-hidden="true"></i><span>Return to Reson8</span></button>
      <button id="btn-exit-stream" title="Exit Stream">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span>Exit Stream</span>
      </button>
    </div>
  </div>
  <script src="viewer.js"></script>
</body>

</html>
